name: CI

on:
  push:
    branches: [main, 'phase-*', 'feat-*']
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Lint, Typecheck, Real Postgres Migrations & Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Apply Migrations & Seed to Live Postgres Container
        env:
          PGPASSWORD: postgrespassword
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          echo "Applying migrations to real PostgreSQL service..."
          for file in $(ls -1 supabase/migrations/*.sql | sort); do
            echo "Executing $file..."
            psql -h localhost -U postgres -d postgres -f "$file"
          done
          echo "Executing seed script..."
          psql -h localhost -U postgres -d postgres -f supabase/seed.sql

      - name: Run Automated Test Suites
        run: npm test
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/postgres

      - name: Build Production Bundle
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://mock-supabase.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'mock-anon-key' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'mock-service-key' }}
